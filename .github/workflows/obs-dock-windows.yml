name: Build TSRB MultiChat OBS Dock (Windows)
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/obs-*'
      - 'desktop/connections.js'
      - 'desktop/core.js'
      - 'desktop/package.json'
      - 'desktop/tests/**'
      - 'obs-dock/**'
      - '.github/workflows/obs-dock-windows.yml'
permissions:
  contents: write
jobs:
  obs-dock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and test
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Package portable backend and OBS launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'obs-dock-package'
          New-Item -ItemType Directory -Force -Path "$stage/app","$stage/runtime" | Out-Null
          Copy-Item obs-dock/* -Destination $stage -Recurse -Exclude '*.md'
          $files = @('obs-server.js','obs-dock.html','obs-dock.css','obs-dock.js','obs-overlay.html','obs-overlay.css','obs-overlay.js','connections.js','core.js','package.json')
          foreach ($file in $files) { Copy-Item "desktop/$file" "$stage/app/$file" }
          Copy-Item 'desktop/node_modules' "$stage/app/node_modules" -Recurse
          $nodeArchive = Join-Path $env:RUNNER_TEMP 'node-win-x64.zip'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.16.0/node-v22.16.0-win-x64.zip' -OutFile $nodeArchive
          Expand-Archive -LiteralPath $nodeArchive -DestinationPath (Join-Path $env:RUNNER_TEMP 'node-win')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'node-win/node-v22.16.0-win-x64/node.exe') "$stage/runtime/node.exe"
          # End-to-end smoke test under Windows PowerShell 5.1, as used by the user's .cmd launcher.
          $launcher = (Resolve-Path "$stage/Start-MultiChat-OBS.ps1").Path
          $stopper = (Resolve-Path "$stage/Stop-MultiChat-OBS.ps1").Path
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell launcher smoke test failed' }
            $tokenPath = Join-Path $env:LOCALAPPDATA 'TSRBMultiChatOBS/access-token.txt'
            if (-not (Test-Path $tokenPath)) { throw 'Launcher did not generate its access token' }
            $accessToken = [IO.File]::ReadAllText($tokenPath).Trim()
            if ($accessToken.Length -lt 24) { throw 'Launcher generated an invalid token' }
            $authenticated = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/status' -Headers @{'X-TSRB-Token'=$accessToken} -TimeoutSec 5
            if ($null -eq $authenticated.platforms) { throw 'OBS chat service did not respond to authenticated requests' }
            $dockLink = Get-Content "$stage/OBS-DOCK-LINK.txt" -Raw
            $overlayLink = Get-Content "$stage/OBS-OVERLAY-LINK.txt" -Raw
            if ($dockLink -notmatch '/dock\\?token=' -or $overlayLink -notmatch '/overlay\\?token=') { throw 'OBS links were not created' }
            $dockResponse = Invoke-WebRequest -Uri $dockLink.Trim() -UseBasicParsing -TimeoutSec 5
            if ($dockResponse.StatusCode -ne 200 -or $dockResponse.Content -notmatch 'TSRB MultiChat') { throw 'OBS dock HTML is not served correctly' }
            Write-Host 'Windows PowerShell 5.1 OBS dock end-to-end smoke test passed.'
          } finally {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stopper
          }
          Compress-Archive -Path "$stage/*" -DestinationPath 'TSRB-MultiChat-OBS-Dock-Windows.zip' -CompressionLevel Optimal
          if (-not (Test-Path 'TSRB-MultiChat-OBS-Dock-Windows.zip')) { throw 'Missing OBS dock package' }
      - uses: actions/upload-artifact@v4
        with:
          name: TSRB-MultiChat-OBS-Dock-Windows
          path: TSRB-MultiChat-OBS-Dock-Windows.zip
          if-no-files-found: error
      - name: Publish OBS Dock ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'obs-dock-v0.1.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag TSRB-MultiChat-OBS-Dock-Windows.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag TSRB-MultiChat-OBS-Dock-Windows.zip --repo $env:GITHUB_REPOSITORY --target main --title 'TSRB MultiChat OBS Dock v0.1.0' --notes 'OBS Browser-Dock-Erweiterung fuer Windows (kein natives OBS-C++-Plugin). ZIP entpacken, Start-MultiChat-OBS.cmd starten, URL unter OBS > Docks > Custom Browser Docks einfuegen.'
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish OBS Dock' }
