name: Stream-Szenen Browser-Tests
on:
  push:
    branches: [main]
    paths:
      - 'scenes.js'
      - 'scenes.css'
      - 'index.html'
      - 'tests/scenes.cjs'
      - '.github/workflows/stream-scenes-tests.yml'
  workflow_dispatch:
jobs:
  scene-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start studio
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/stream-scenes-server.log 2>&1 &
          sleep 2
      - name: Test visual selection and OBS
        run: node tests/scenes.cjs
