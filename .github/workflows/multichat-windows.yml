name: Build and publish TSRB MultiChat Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/multichat-windows.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: TSRB-MultiChat-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish direct Windows EXE download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "multichat-v$version"
          $exe = Get-ChildItem -Path dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw "No Windows executable found in desktop/dist" }
          $download = "dist/TSRB-MultiChat-Windows.exe"
          Copy-Item -LiteralPath $exe.FullName -Destination $download -Force
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $download --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $download --repo $env:GITHUB_REPOSITORY --target main --title "TSRB MultiChat v$version (Windows)" --notes "Portable Windows-Version von TSRB MultiChat. EXE herunterladen und starten; kein Installer erforderlich." --latest
          }
