name: Build and publish TSRB MultiChat Web Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/multichat-windows.yml'

permissions:
  contents: write

concurrency:
  group: multichat-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist
      - name: Check web installer and downloadable package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/nsis-web/TSRB-MultiChat-Setup.exe")) {
            throw "Web installer EXE was not built"
          }
          $packages = @(Get-ChildItem -Path dist/nsis-web -Filter '*.nsis.7z' -File)
          if ($packages.Count -eq 0) {
            throw "Missing required application download package (*.7z)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TSRB-MultiChat-Web-Installer
          path: |
            desktop/dist/nsis-web/TSRB-MultiChat-Setup.exe
            desktop/dist/nsis-web/*.nsis.7z
            desktop/dist/nsis-web/latest.yml
          if-no-files-found: error
      - name: Publish web installer and package to GitHub Releases
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $assets = @("dist/nsis-web/TSRB-MultiChat-Setup.exe")
          $assets += @(Get-ChildItem -Path dist/nsis-web -Filter '*.nsis.7z' -File | ForEach-Object { $_.FullName })
          if (Test-Path 'dist/nsis-web/latest.yml') { $assets += 'dist/nsis-web/latest.yml' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload web installer assets" }
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target main --title "TSRB MultiChat v$version (Windows Web Installer)" --notes "Windows-Web-Installer: Setup starten, Download-Fortschritt ansehen und TSRB MultiChat installieren. Benötigt Internet während der Installation." --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish web installer release" }
          }
