name: Overlay editor browser tests
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'editor.css'
      - 'themes.css'
      - 'studio-v2.css'
      - 'tests/**'
      - '.github/workflows/overlay-editor-tests.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start local editor web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/overlay-http.log 2>&1 &
          sleep 2
      - name: Run editor and OBS browser checks
        run: npm test
      - name: Upload screenshots for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-test-screenshots
          path: /tmp/editor-*.png
          if-no-files-found: ignore
