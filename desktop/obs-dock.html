<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>TSRB MultiChat · OBS</title>
<link rel="stylesheet" href="/dock.css"></head><body>
<header><div class="brand"><span class="logo">✦</span><div><strong>TSRB MultiChat</strong><small>OBS Chat-Dock</small></div></div><span id="health" role="status">Verbinde …</span></header>
<section class="platforms" aria-label="Live-Plattformen" id="platforms"></section>
<div class="note">Twitch, TikTok, Kick und YouTube: öffentliche LIVE-Chats. Facebook und Instagram: derzeit kein automatischer Import.</div>
<section class="toolbar"><select id="filter" aria-label="Chat filtern"><option value="all">Alle Chats</option></select><button id="clear">Leeren</button></section>
<main id="chat" aria-live="polite"><p class="empty">Noch keine Chat-Nachrichten. Oben einen LIVE-Kanal verbinden.</p></main>
<footer><button id="copy-overlay">OBS-Overlay-Link kopieren</button><span id="toast" role="status"></span></footer>
<script src="/dock.js" defer></script></body></html>
